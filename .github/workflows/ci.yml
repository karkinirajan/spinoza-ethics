name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the oldest supported (package.json "engines"); 26 is the current LTS (.nvmrc).
        node: ['24', '26']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint (zero warnings)
        run: npm run lint
      - name: Tests with coverage
        run: npm run test:coverage
      # No GROQ_API_KEY: the key is read at request time, so the build needs none.
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit
      - name: Upload coverage
        if: matrix.node == '26'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
